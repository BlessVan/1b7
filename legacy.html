  body {
    margin: 0;

  .page {

  }
  .subtitle {
    color: #777;

    margin-bottom: 2rem;
  }

    padding: 1.5rem;

    text-decoration: none;

  .entry:hover {
    box-shadow: 0 0 14px rgba(42, 169, 160, 0.35);

  }
  .avatar {
    flex-shrink: 0;
    width: 64px;

    font-family: 'Dancing Script', cursive;
    font-size: 1.4rem;
    font-weight: 700;
  }
  .entry-details h2 {
    font-family: 'Dancing Script', cursive;
    font-size: 1.4rem;
    color: #222;
    margin: 0 0 0.2rem;
  }
  .entry-details .dates {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 0.5rem;
  }
  .entry-details p {
    font-size: 0.92rem;
    color: #444;
    margin: 0;
    line-height: 1.4;
  }
  .note {
    font-size: 0.85rem;
    color: #999;
    margin-top: 2rem;
    font-style: italic;
  }
  .back-link {
    display: block;
    margin-top: 2rem;
    color: var(--turquoise-dark);

</style>
