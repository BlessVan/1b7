<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1B7.com — Your Roadmap to the Internet</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --turquoise: #2AA9A0;
    --turquoise-dark: #1E7A73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .page {
    width: 100%;
    max-width: 480px;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 2.4rem;
    color: var(--turquoise);
    text-shadow: 0 0 12px rgba(42, 169, 160, 0.5);
    margin: 0 0 1.5rem;
  }
  #searchInput {
    width: 100%;
    height: 48px;
    font-size: 1.1rem;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  #searchInput:focus {
    outline: none;
    border-color: var(--turquoise);
    box-shadow: 0 0 6px rgba(42, 169, 160, 0.4);
  }
  .side-button {
    position: fixed;
    bottom: 2.5rem;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: var(--turquoise);
    color: #fff;
    border: none;
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 1.15rem;
    cursor: pointer;
    box-shadow: 0 0 20px 6px rgba(42, 169, 160, 0.55);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .side-button:hover {
    box-shadow: 0 0 26px 10px rgba(42, 169, 160, 0.7);
    transform: scale(1.05);
  }
  #aisButton { left: 2.5rem; }
  #opinionsButton { right: 2.5rem; }

  /* Question overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.97);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.active { display: flex; }
  .question-box {
    max-width: 420px;
    width: 90%;
    text-align: center;
  }
  .question-box p {
    font-size: 1.15rem;
    color: #222;
    margin-bottom: 1.25rem;
  }
  .question-box select,
  .question-box input[type="number"] {
    width: 100%;
    height: 46px;
    font-size: 1rem;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 1.25rem;
  }
  .question-box button.next {
    background: var(--turquoise);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.75rem 2rem;
    font-size: 1rem;
    cursor: pointer;
  }
  .question-box button.next:hover { background: var(--turquoise-dark); }
  .engine-links {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .engine-links a {
    display: block;
    padding: 0.75rem;
    border: 1px solid var(--turquoise);
    border-radius: 8px;
    color: var(--turquoise-dark);
    text-decoration: none;
    font-size: 1rem;
  }
  .engine-links a:hover { background: rgba(42,169,160,0.08); }
  .close-overlay {
    margin-top: 1.5rem;
    background: none;
    border: none;
    color: #888;
    font-size: 0.9rem;
    cursor: pointer;
    text-decoration: underline;
  }
  .go-link {
    display: inline-block;
    padding: 0.75rem 2rem;
    border-radius: 8px;
    background: var(--turquoise);
    color: #fff;
    text-decoration: none;
    font-size: 1.05rem;
  }
  .go-link:hover { background: var(--turquoise-dark); }
  .or-general {
    margin-top: 1.25rem;
    background: none;
    border: none;
    color: var(--turquoise-dark);
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: underline;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>

<div class="page">
  <h1>What are you searching for:</h1>
  <input type="text" id="searchInput" placeholder="Type your search" autocomplete="off">
</div>

<button id="aisButton" class="side-button" onclick="window.location.href='ais.html'">AIs</button>
<button id="opinionsButton" class="side-button" onclick="window.location.href='opinions.html'">Opinions</button>

<footer style="position:fixed;bottom:0.5rem;left:0;right:0;text-align:center;font-size:0.8rem;color:#999;">
  &copy; 2026 Blessed Corporation. All rights reserved. &middot;
  <a href="mailto:blessed.1b7@gmail.com" style="color:#2AA9A0;text-decoration:none;">Contact the developer</a>
</footer>

<!-- Direct site step -->
<div class="overlay" id="stepDirect">
  <div class="question-box">
    <p>It looks like you're looking for a specific website.</p>
    <a class="go-link" id="directLink" href="#" target="_blank" rel="noopener">Go to site</a>
    <button class="or-general" onclick="proceedGeneral()">No, search this as a general topic instead</button>
    <div><button class="close-overlay" onclick="closeOverlay()">Cancel</button></div>
  </div>
</div>

<!-- Question 2: Suffix -->
<div class="overlay" id="step2">
  <div class="question-box">
    <p>Do you know the suffix you're looking for?</p>
    <select id="suffixSelect">
      <option value="">I don't know</option>
      <option value=".com">.com</option>
      <option value=".org">.org</option>
      <option value=".edu">.edu</option>
      <option value=".gov">.gov</option>
      <option value=".net">.net</option>
      <option value=".info">.info</option>
      <option value=".services">.services</option>
    </select>
    <button class="next" onclick="goToStep3()">Next</button>
    <div><button class="close-overlay" onclick="closeOverlay()">Cancel</button></div>
  </div>
</div>

<!-- Question 3: Narrow down -->
<div class="overlay" id="step3">
  <div class="question-box">
    <p>Would you like to narrow down the number of results?</p>
    <input type="number" id="resultCount" placeholder="e.g. 10 (leave blank for all)" min="1">
    <button class="next" onclick="goToStep4()">Next</button>
    <div><button class="close-overlay" onclick="closeOverlay()">Cancel</button></div>
  </div>
</div>

<!-- Step 4: Choose search engine -->
<div class="overlay" id="step4">
  <div class="question-box">
    <p>Choose where to search:</p>
    <div class="engine-links" id="engineLinks"></div>
    <div><button class="close-overlay" onclick="closeOverlay()">Cancel</button></div>
  </div>
</div>

<script>
  let searchTerm = '';
  let suffix = '';
  let resultCount = '';

  function looksLikeWebsite(term) {
    return term.includes('.') && !term.includes(' ');
  }

  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && this.value.trim() !== '') {
      searchTerm = this.value.trim();
      if (looksLikeWebsite(searchTerm)) {
        let url = searchTerm;
        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }
        document.getElementById('directLink').href = url;
        document.getElementById('stepDirect').classList.add('active');
      } else {
        document.getElementById('step2').classList.add('active');
      }
    }
  });

  function proceedGeneral() {
    document.getElementById('stepDirect').classList.remove('active');
    document.getElementById('step2').classList.add('active');
  }

  function goToStep3() {
    suffix = document.getElementById('suffixSelect').value;
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step3').classList.add('active');
  }

  function goToStep4() {
    resultCount = document.getElementById('resultCount').value;
    document.getElementById('step3').classList.remove('active');
    buildEngineLinks();
    document.getElementById('step4').classList.add('active');
  }

  function buildEngineLinks() {
    let query = searchTerm;
    if (suffix) {
      query += ' site:' + suffix;
    }

    const engines = [
      { name: 'Google', url: 'https://www.google.com/search?q=' },
      { name: 'Bing', url: 'https://www.bing.com/search?q=' },
      { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
      { name: 'Yahoo', url: 'https://search.yahoo.com/search?p=' }
    ];

    const container = document.getElementById('engineLinks');
    container.innerHTML = '';

    engines.forEach(engine => {
      let params = 'q=' + encodeURIComponent(query);
      if (resultCount && engine.name === 'Google') {
        params += '&num=' + encodeURIComponent(resultCount);
      }
      const link = document.createElement('a');
      link.href = engine.url + encodeURIComponent(query);
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = engine.name;
      container.appendChild(link);
    });
  }

  function closeOverlay() {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
    document.getElementById('searchInput').value = '';
  }
</script>

</body>
</html>
