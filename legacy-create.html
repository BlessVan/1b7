<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1B7.com — Create a Blessed Legacy</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --turquoise: #2AA9A0;
    --turquoise-dark: #1E7A73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .page {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 2.2rem;
    color: var(--turquoise);
    text-shadow: 0 0 12px rgba(42, 169, 160, 0.5);
    margin: 0 0 0.3rem;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #777;
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }
  label {
    display: block;
    font-size: 0.92rem;
    color: #555;
    margin-bottom: 0.35rem;
    margin-top: 1.1rem;
  }
  input[type="text"],
  input[type="date"],
  input[type="file"],
  textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-family: inherit;
    font-size: 0.98rem;
  }
  textarea { resize: vertical; }
  .row {
    display: flex;
    gap: 0.75rem;
  }
  .row > div { flex: 1; }
  .note {
    font-size: 0.85rem;
    color: #999;
    margin-top: 0.5rem;
    font-style: italic;
  }
  button.submit {
    width: 100%;
    height: 48px;
    margin-top: 1.75rem;
    border: none;
    border-radius: 8px;
    background: var(--turquoise);
    color: #fff;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button.submit:hover { background: var(--turquoise-dark); }
  .back-link {
    display: block;
    margin-top: 1.5rem;
    color: var(--turquoise-dark);
    text-align: center;
  }
</style>
</head>
<body>

<div class="page">
  <h1>Create a Blessed Legacy</h1>
  <p class="subtitle">Share the story of a loved one.</p>

  <form action="https://formspree.io/f/mqpzddbj" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="_subject" value="Blessed Legacy Submission">
    <input type="hidden" name="_next" value="https://1b7.com/legacy-thankyou.html">

    <label for="fullName">Full name</label>
    <input type="text" id="fullName" name="Full name" required>

    <div class="row">
      <div>
        <label for="dateDeparted">Date departed</label>
        <input type="date" id="dateDeparted" name="Date departed">
      </div>
      <div>
        <label for="zip">ZIP code</label>
        <input type="text" id="zip" name="ZIP code" maxlength="5">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="city">City</label>
        <input type="text" id="city" name="City">
      </div>
      <div>
        <label for="state">State</label>
        <input type="text" id="state" name="State">
      </div>
    </div>

    <label for="photo">Photo</label>
    <input type="file" id="photo" name="Photo" accept="image/*">

    <label for="story">Their story</label>
    <textarea id="story" name="Their story" rows="6" placeholder="Share memories, character, and the moments that mattered."></textarea>

    <button class="submit" type="submit">Submit for Review</button>
  </form>

  <a class="back-link" href="legacy.html">&larr; Back to Your Blessed Legacy</a>
</div>

</body>
</html>
